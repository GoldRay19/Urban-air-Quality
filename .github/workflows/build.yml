name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node --input-type=module -e "import('./src/knowledge.js').then(({KNOWLEDGE}) => { if (KNOWLEDGE.length !== 100) throw new Error('Knowledge base must contain exactly 100 answers'); console.log('Validated 100 knowledge answers'); })"
