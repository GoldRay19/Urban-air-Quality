databases:
  - name: airaware-db
    plan: free
    databaseName: airaware
    user: airaware

services:
  - type: web
    name: airaware
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: airaware-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
